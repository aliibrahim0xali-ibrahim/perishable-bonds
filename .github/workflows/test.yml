name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show forge version
        run: forge --version

      - name: Install dependencies
        # Pinned explicitly: a bare `forge install` only reconciles deps
        # already recorded (submodules/foundry.lock) and would install
        # nothing against a fresh checkout with lib/ gitignored.
        run: forge install foundry-rs/forge-std@v1.9.6 OpenZeppelin/openzeppelin-contracts@v5.3.0

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

      - name: Coverage summary
        run: forge coverage --report summary
