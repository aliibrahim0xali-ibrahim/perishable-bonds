[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 200
fail_on_revert = false

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 512, depth = 400 }

# See more config options https://book.getfoundry.sh/reference/config
